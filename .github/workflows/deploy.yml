name: NoteSphere CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. BUILD & TEST BACKEND (Java 21 / Spring Boot)
  # =========================================================================
  backend-build-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        run: mvn clean test --batch-mode

      - name: Package Spring Boot JAR
        run: mvn package -DskipTests --batch-mode

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesphere-backend-jar
          path: target/*.jar
          retention-days: 3

  # =========================================================================
  # 2. BUILD FRONTEND (React / Vite)
  # =========================================================================
  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite App
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesphere-frontend-dist
          path: frontend/dist
          retention-days: 3

  # =========================================================================
  # 3. AWS AUTHENTICATION & DEPLOYMENT
  # =========================================================================
  deploy-to-aws:
    name: Deploy to AWS
    needs: [backend-build-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: notesphere-backend-jar
          path: target/

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: notesphere-frontend-dist
          path: frontend/dist/

      # ---------------------------------------------------------------------
      # Authenticate with AWS using your IAM User Access Key & Secret Key
      # ---------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Verify AWS Connection
        run: |
          echo "Successfully authenticated with AWS IAM!"
          aws sts get-caller-identity

      # ---------------------------------------------------------------------
      # OPTION A: Deploy to EC2 via SSH (if secrets.EC2_HOST is configured)
      # ---------------------------------------------------------------------
      - name: Deploy to EC2 (Optional)
        if: "${{ env.EC2_HOST != '' }}"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Deploying to EC2 instance: $EC2_HOST..."
          # Creates SSH key and copies JAR / frontend build to EC2
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # scp -o StrictHostKeyChecking=no target/*.jar $EC2_USER@$EC2_HOST:/opt/notesphere/app.jar
          # ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST "sudo systemctl restart notesphere"
