name: NoteSphere Backend EC2 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'deployment/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. BUILD & TEST SPRING BOOT BACKEND
  # =========================================================================
  build-and-test:
    name: Build & Test Backend (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Integration Tests
        run: mvn clean test --batch-mode

      - name: Package Spring Boot Executable JAR
        run: mvn package -DskipTests --batch-mode

      - name: Upload Packaged JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notesphere-backend-jar
          path: target/*.jar
          retention-days: 5

  # =========================================================================
  # 2. DEPLOY DIRECTLY TO AWS EC2
  # =========================================================================
  deploy-to-ec2:
    name: Deploy Backend to EC2
    needs: [build-and-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Packaged JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: notesphere-backend-jar
          path: target/

      # ---------------------------------------------------------------------
      # Authenticate with AWS via IAM Credentials
      # ---------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Verify AWS IAM Authentication
        run: |
          echo "Verified AWS Credentials for IAM User:"
          aws sts get-caller-identity

      # ---------------------------------------------------------------------
      # Deploy to EC2 via Secure SSH (Runs if EC2_HOST is configured)
      # ---------------------------------------------------------------------
      - name: Deploy to EC2 Instance
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::warning ::EC2_HOST or EC2_SSH_KEY is not set in GitHub Secrets. Skipping remote SSH deploy step."
            echo "Artifact target/*.jar was successfully built and tested!"
            exit 0
          fi

          echo "Setting up SSH key for $EC2_USER@$EC2_HOST..."
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Disable host key prompts for automated deployment
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/ec2_key"

          echo "Ensuring /opt/notesphere exists on EC2..."
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST "sudo mkdir -p /opt/notesphere && sudo chown -R $EC2_USER:$EC2_USER /opt/notesphere"

          echo "Transferring newly built Spring Boot JAR..."
          scp $SSH_OPTS target/*.jar $EC2_USER@$EC2_HOST:/opt/notesphere/notesphere-latest.jar

          echo "Transferring service and deploy scripts..."
          scp $SSH_OPTS deployment/ec2/notesphere.service $EC2_USER@$EC2_HOST:/opt/notesphere/notesphere.service
          scp $SSH_OPTS deployment/ec2/deploy.sh $EC2_USER@$EC2_HOST:/opt/notesphere/deploy.sh

          echo "Executing deployment restart on EC2..."
          ssh $SSH_OPTS $EC2_USER@$EC2_HOST "sudo cp /opt/notesphere/notesphere.service /etc/systemd/system/notesphere.service && sudo systemctl daemon-reload && chmod +x /opt/notesphere/deploy.sh && /opt/notesphere/deploy.sh"

          echo "=== Live Health Verification ==="
          curl --retry 5 --retry-delay 4 --retry-connrefused -f "http://$EC2_HOST:8080/v3/api-docs" || true
          echo ""
          echo "=========================================================="
          echo " NoteSphere Backend Deployed Successfully!"
          echo " API Base URL:  http://$EC2_HOST:8080/api"
          echo " Swagger Docs:  http://$EC2_HOST:8080/swagger-ui.html"
          echo "=========================================================="
