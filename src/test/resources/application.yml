spring:
  application:
    name: NoteSphere-Test

  datasource:
    url: jdbc:h2:mem:db_notesphere;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-client-id
            client-secret: dummy-google-client-secret
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# JWT Configuration
app:
  jwt:
    secret: NoteSphereSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong2024SecureKeyTest
    access-token-expiration-ms: 86400000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
