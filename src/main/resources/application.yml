server:
  port: 8080

spring:
  application:
    name: NoteSphere

  datasource:
    url: jdbc:mysql://localhost:3306/db_notesphere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:NoteSphereSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong2024SecureKey}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none

logging:
  level:
    com.notesphere: DEBUG
    org.springframework.security: INFO
